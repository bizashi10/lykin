# Builds the Opus Windows installer automatically.
# - Every push to main: builds and attaches the installer to the run (Actions tab → run → Artifacts).
# - Pushing a tag like "opus-v0.1.0": also publishes it as a GitHub Release (easy download page).
name: Build Opus for Windows

on:
  push:
    branches: [main]
    paths: ["apps/opus/**", ".github/workflows/build-opus.yml"]
    tags: ["opus-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/opus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/opus/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/opus/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Ghostscript powers Compress, Grayscale, Repair and PDF/A. It ships inside
      # the installer so Opus works fully offline.
      - name: Bundle Ghostscript
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view -R ArtifexSoftware/ghostpdl-downloads --json tagName,assets | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match '^gs\d+w64\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "No 64-bit Ghostscript installer in release $($rel.tagName)" }
          Write-Host "Bundling $($asset.name) from $($rel.tagName)"
          gh release download $rel.tagName -R ArtifexSoftware/ghostpdl-downloads -p $asset.name -O gs-setup.exe
          Start-Process -FilePath .\gs-setup.exe -ArgumentList '/S','/D=C:\gs' -Wait
          $dest = "src-tauri/resources/gs"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item C:\gs\bin\gswin64c.exe, C:\gs\bin\gsdll64.dll -Destination $dest
          Get-ChildItem C:\gs -Recurse -Include "COPYING*","LICENSE*" | Select-Object -First 1 | Copy-Item -Destination "$dest/LICENSE-Ghostscript.txt"
          & "$dest/gswin64c.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Ghostscript failed to run" }

      - name: Run engine tests
        run: npm test

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/opus
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'Opus __VERSION__' || '' }}
          releaseBody: "Download the file ending in -setup.exe below and run it to install Opus."
          releaseDraft: false
          prerelease: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Opus-Windows-Installer
          path: apps/opus/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
