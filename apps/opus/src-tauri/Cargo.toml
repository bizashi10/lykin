[package]
name = "lykin-opus"
version = "0.1.0"
description = "Opus — the PDF app of the Lykin office suite"
edition = "2021"

[lib]
name = "opus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
